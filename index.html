<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AAB 安装助手</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app">
        <header class="app-header">
            <div>
                <h1>AAB 安装助手</h1>
                <p class="sub" id="appversion">测试签名 · 不能覆盖商店正式包</p>
            </div>
            <div class="header-actions">
                <span id="updatechip" class="chip chip-warn hidden">有新版本</span>
                <button type="button" id="btn-update" class="btn" onclick="CheckUpdate()">检查更新</button>
                <button type="button" id="btn-about" class="btn btn-icon" title="关于" aria-label="关于" onclick="OpenProjectLink(event)">
                    <span class="btn-icon-glyph" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" focusable="false">
                            <path fill="currentColor" fill-rule="evenodd" d="M20.5 12a8.5 8.5 0 1 0-17 0 8.5 8.5 0 1 0 17 0zm-7.35-4a1.15 1.15 0 1 0-2.3 0 1.15 1.15 0 1 0 2.3 0zM11.15 10.5h1.7v6.1h-1.7z"/>
                        </svg>
                    </span>
                </button>
            </div>
        </header>

        <div class="banner" id="banner">
            安装结果使用 Android debug 测试签名，无法覆盖正式签名应用，也不能用于上架。
        </div>
        <div id="updatemsg" class="update-msg hidden"></div>

        <section class="card">
            <div class="card-title">设备</div>
            <div class="row">
                <label for="connectdevice">当前连接设备</label>
                <select id="connectdevice" name="connectdevice" class="grow"></select>
                <button type="button" class="btn" onclick="RefreshConnectDevice()">刷新</button>
            </div>
        </section>

        <section class="card">
            <div class="card-title">安装包</div>
            <div class="row">
                <label for="aabhistory">候选文件</label>
                <select id="aabhistory" name="aabhistory" class="grow path-select"></select>
                <button type="button" class="btn" onclick="RefreshAabCandidates()">刷新目录</button>
            </div>
            <div id="aabdirhint" class="hint"></div>
            <div id="holder" class="drop-zone" onclick="showSelectAabFile()">
                <div id="message" class="dropify-message">点击或将 aab 拖到这里选择文件</div>
            </div>
        </section>

        <section class="card log-card">
            <div class="row">
                <div class="card-title">日志</div>
                <span id="statechip" class="chip">空闲</span>
                <button type="button" class="btn" id="btn-copy-log" onclick="CopyLog()">复制日志</button>
                <button type="button" class="btn" onclick="ClearLog()">清除日志</button>
            </div>
            <div id="log" class="log-wrapper">准备就绪</div>
        </section>

        <footer class="app-footer">
            <button type="button" id="btn-install" class="btn btn-primary" onclick="InstallAAb()" disabled>安装 AAB</button>
        </footer>
    </div>

    <script type="text/javascript" src="./handle_drag.js"></script>
    <script type="text/javascript" src="./process.js"></script>
</body>

</html>
