name: release-macos

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install and build dmg
        run: |
          npm install
          npm run elebuild_mac
      - name: Upload dmg to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DMG=$(ls release/*.dmg | head -n 1)
          test -n "$DMG"
          NAME="AabInstalllHelp-${VERSION}-macos.dmg"
          cp "$DMG" "$NAME"
          HASH=$(shasum -a 256 "$NAME" | awk '{print $1}')

          echo "Waiting for GitHub Release $GITHUB_REF_NAME"
          i=1
          while [ "$i" -le 36 ]; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "Release $GITHUB_REF_NAME not found"
              exit 1
            fi
            sleep 5
            i=$((i + 1))
          done

          gh release upload "$GITHUB_REF_NAME" "$NAME" --clobber

          SUMS=SHA256SUMS.txt
          rm -f "$SUMS"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS.txt --clobber || true
          if [ -f "$SUMS" ]; then
            grep -v -E "(macos/${NAME}|[[:space:]]${NAME}$)" "$SUMS" > "${SUMS}.tmp" || true
            mv "${SUMS}.tmp" "$SUMS"
          fi
          printf "%s  macos/%s\n" "$HASH" "$NAME" >> "$SUMS"
          gh release upload "$GITHUB_REF_NAME" "$SUMS" --clobber
