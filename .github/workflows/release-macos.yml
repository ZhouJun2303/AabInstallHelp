name: release-macos

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the dmg to (e.g. v1.0.5). Defaults to v + package.json version."
        required: false

jobs:
  macos:
    # Electron 7 ships darwin-x64 only. macos-latest is Apple Silicon and
    # npm install 404s on electron-v7.1.6-darwin-arm64.zip.
    runs-on: macos-15-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install and build dmg
        env:
          npm_config_arch: x64
        run: |
          npm install
          npm run elebuild_mac
      - name: Upload dmg to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG:-}" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          DMG=$(ls release/*.dmg | head -n 1)
          test -n "$DMG"
          NAME="AabInstalllHelp-${VERSION}-macos.dmg"
          cp "$DMG" "$NAME"
          HASH=$(shasum -a 256 "$NAME" | awk '{print $1}')

          echo "Waiting for GitHub Release $TAG"
          i=1
          while [ "$i" -le 36 ]; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 36 ]; then
              echo "Release $TAG not found"
              exit 1
            fi
            sleep 5
            i=$((i + 1))
          done

          gh release upload "$TAG" "$NAME" --clobber

          SUMS=SHA256SUMS.txt
          rm -f "$SUMS"
          gh release download "$TAG" --pattern SHA256SUMS.txt --clobber || true
          if [ -f "$SUMS" ]; then
            grep -v -E "(macos/${NAME}|[[:space:]]${NAME}$)" "$SUMS" > "${SUMS}.tmp" || true
            mv "${SUMS}.tmp" "$SUMS"
          fi
          printf "%s  macos/%s\n" "$HASH" "$NAME" >> "$SUMS"
          gh release upload "$TAG" "$SUMS" --clobber
